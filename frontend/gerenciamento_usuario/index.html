<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan Control</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../global.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="..\imagens\favicon\favicon.ico">
</head>
<body>
    <div class="menu">
        <div class="menuhead"> <img src="../imagens/favicon/android-chrome-192x192-removebg-preview.png" alt="logo" width="100px" height="100px">
        <h2>TITAN CONTROL</h2></div>
        <button class="btnmenu" id="btndashboard" style="margin-top: 50px;"><img src="../imagens/incones/dashboard-logo .png" alt="" width="32px" height="32px"> dashboard</button>
        <button class="btnmenu" id="btnprodutos"> <img src="../imagens/incones/produtos-logo.png" alt="icone" width="32px" height="32px"> produtos</button>
        <button class="btnmenu" id="btnvendas"> <img src="../imagens/incones/carrinho-logo.png" alt="icone" width="32px" height="32px"> vendas</button>
        <button class="btnmenu" id="btnuser"> <img src="../imagens/incones/user-logo.png" alt="icone" width="32px" height="32px"> gestao de usuarios</button>
        <button class="btnmenu" id="btnconfig"> <img src="../imagens/incones/config-logo.png" alt="icone" width="32px" height="32px"> configurações</button>
        <button class="btnmenu" id="btnsair" style="color: rgb(201, 5, 5); margin-top: 50px;">sair</button>
    </div>
    <div class="formCadastrar">
        <strong>
            <p>CADASTRAR NOVO FUNCIONÁRIO</p>
        </strong>
        <form class="group1">
            <div class="group2">
                <strong><label for="name">Nome Completo</label></strong>
                <input type="text" placeholder="Digite o nome completo" id="name">
            </div>
            <div class="group2">
                <strong><label for="cpf">CPF</label></strong>
                <input type="tel" placeholder="000.000.000-00" id="cpf">
            </div>
            <div class="group2">
                <strong><label for="senha">Senha</label></strong>
                <input type="password" placeholder="Digite a senha" id="senha">
            </div>
            <strong><label for="status">Status</label></strong>
            <label class="switch">
                <input type="checkbox" id="status" checked>
                <span class="slider"></span>
            </label>
            <strong><label for="admin">Admin</label></strong>
            <label class="switch">
                <input type="checkbox" id="admin">
                <span class="slider"></span>
            </label>
            <button type="submit" id="btnpost">SALVAR</button>
        </form>
    </div>
    <!-- <br> 
    <div id="textbox"></div>
    <br> -->
    <div class="tablebox">
        <thead>
        <table>
            <tr>
                <th id="id_user">ID</th>
                <th id="nome_user">Nome</th>
                <th id="cpf_user">CPF</th>
                <th id="status_user">Status</th>
                <th id="mod_user">Ações</th>
            </tr>
        </table>
    <tbody>
        <table id="body_infos"></table>
    </tbody>
    </div>   
    <script src="script.js"></script>
    <script src="../global.js"></script>
</body>
</html>
